<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1320">
<title>步步 · 白板端（教室大屏）原型</title>
<style>
/* ====== Design tokens（与教师端 / 学生端一致） ====== */
:root{
  --primary:#22c993; --primary-dark:#0ea874; --primary-soft:#e8f7f0;
  --accent:#7d6cf2; --accent-dark:#5b48d6; --accent-soft:#eee9ff;
  --warn:#f5a623; --warn-soft:#fff4e0;
  --danger:#e85a5a; --danger-soft:#fde7e7;
  --text:#1a2332; --muted:#6c7689; --muted-2:#9aa4b8;
  --line:#e3e6ec; --line-soft:#eef0f4;
  --surface:#ffffff; --surface-2:#f6f8fa;
  --bg:#eef1f6;
  --shadow:0 6px 20px rgba(20,30,55,.08);
  --shadow-lg:0 16px 50px rgba(20,30,55,.12);
  --radius:10px; --radius-lg:14px;
}
*{ box-sizing:border-box }
html, body{ margin:0; padding:0; }
body{
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.group-mark{
  width:17px; height:17px; display:inline-block; position:relative; flex:none;
}
.group-mark::before{
  content:""; position:absolute; left:1px; top:1px; width:7px; height:7px; border-radius:3px;
  background:#7d6cf2; box-shadow:8px 0 0 #22c993, 4px 8px 0 #f59e0b;
}
.group-mark::after{
  content:""; position:absolute; left:4px; top:4px; width:9px; height:9px; border-radius:4px;
  border:2px solid currentColor; opacity:.42;
}

/* ====== Whiteboard device shell（大屏外壳） ====== */
.board-shell{ max-width:1240px; margin: 0 auto 18px; padding: 0 20px; display:flex; justify-content:center; }
.board-frame{ width:1100px; max-width:100%; position:relative; }
.board-outer{
  background: #1a1f2c;
  padding: 22px 18px 14px;
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(20, 30, 55, .26), inset 0 0 0 1px rgba(255,255,255,.04);
}
.board-screen{
  width:100%; aspect-ratio: 16 / 9;
  background: linear-gradient(135deg, #f6f8fa 0%, #edf2f7 100%);
  border-radius: 8px;
  position:relative; overflow:hidden;
}
.scene-root{position:absolute;inset:0;overflow:hidden}
.lesson-controls{
  display:flex; align-items:center; justify-content:center; gap:12px;
  padding:12px 6px 0;
}
.lesson-nav-btn{
  height:30px; min-width:74px; padding:0 14px;
  border-radius:8px; border:1px solid rgba(255,255,255,.18);
  background:#fff; color:#111827; font:inherit; font-size:12px; font-weight:900;
  cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.12);
}
.lesson-nav-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.lesson-nav-btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.lesson-page-label{
  min-width:230px; text-align:center;
  font-size:12px; color:#cbd5e1; font-weight:800;
}
.board-stand{
  position:absolute; left:50%; bottom:-32px; transform:translateX(-50%);
  width:280px; height:14px;
  background: linear-gradient(180deg, #353b4c 0%, #1a1f2c 100%);
  border-radius: 0 0 8px 8px;
  box-shadow: 0 6px 16px rgba(0,0,0,.18);
}
.board-stand::after{
  content:""; position:absolute; left:50%; top:14px; transform:translateX(-50%);
  width:140px; height:8px;
  background: linear-gradient(180deg, #1a1f2c 0%, #0d1018 100%);
  border-radius: 0 0 12px 12px;
}

/* ====== 大屏内部通用 UI ====== */
.bd-topbar{
  position:absolute; top:14px; left:18px; right:18px;
  display:flex; justify-content:space-between; align-items:center;
  z-index:5;
}
.bd-topbar .left, .bd-topbar .right{ display:flex; gap:8px; align-items:center; }
.chip{
  display:inline-flex; gap:6px; align-items:center;
  padding:5px 11px; border-radius:99px;
  background: var(--surface); border:1px solid var(--line-soft);
  font-size:12px; font-weight:700; color:var(--text);
  box-shadow: 0 1px 2px rgba(20,30,55,.04);
}
.chip strong{ color: var(--primary-dark); }
.chip.live{
  background: var(--danger-soft); color:var(--danger); border-color: rgba(232,90,90,.2);
}
.chip.live::before{
  content:""; width:7px; height:7px; border-radius:50%; background:var(--danger);
  animation: livePulse 1.4s infinite;
}
@keyframes livePulse{ 0%,100%{ opacity:.5; transform:scale(1) } 50%{ opacity:1; transform:scale(1.4) } }

.bd-aibar{
  position:absolute; left:18px; right:18px; bottom:14px;
  background: rgba(125,108,242,.94); color:#fff;
  padding:10px 14px; border-radius:10px;
  font-size:12.5px; font-weight:600;
  display:flex; gap:10px; align-items:center;
  box-shadow: 0 6px 18px rgba(125,108,242,.32);
  z-index:5;
}
.bd-aibar::before{
  content:"状态"; flex:none;
  font-weight:800; font-size:10px; letter-spacing:.5px;
  background: rgba(255,255,255,.22); padding:3px 7px; border-radius:5px;
}
.bd-aibar .ai-text{ flex:1; line-height:1.55; }
.bd-aibar .ai-text strong{ color:#fff7e0; }

/* ====== Scene · welcome ====== */
.scn-welcome{
  position:absolute; inset:0; padding: 56px 40px 72px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: linear-gradient(135deg, #f0f5ff 0%, #e6f9f3 100%);
}
.w-eyebrow{ font-size:14px; color:var(--primary-dark); font-weight:700; letter-spacing:1px; margin-bottom:8px; }
.w-title{ font-size:48px; font-weight:800; color:var(--text); margin:6px 0 8px; line-height:1.15; }
.w-sub{ font-size:16px; color:var(--muted); font-weight:500; margin-bottom:22px; }
.w-cd{
  display:inline-flex; gap:12px; align-items:baseline;
  background: var(--surface); padding:12px 22px; border-radius:14px;
  box-shadow: var(--shadow); border:1px solid var(--line-soft);
  margin-bottom:20px;
}
.w-cd .lab{ font-size:13px; color:var(--muted); font-weight:600; }
.w-cd .num{ font-size:30px; font-weight:800; color:var(--primary-dark); font-variant-numeric: tabular-nums; }
.pad-grid{ display:grid; grid-template-columns: repeat(14, 1fr); gap:5px; margin-top: 6px; max-width:520px; width:100%; }
.pad-grid .p{ aspect-ratio:1; background: var(--primary); border-radius:3px; box-shadow: 0 2px 4px rgba(34,201,147,.22); }
.pad-grid .p.charge{ background: var(--warn); }
.pad-grid .p.off{ background: var(--line); box-shadow:none; }
.pad-stat{ display:flex; gap:14px; margin-top:8px; font-size:12px; color:var(--muted); font-weight:600; }
.pad-stat span{ display:inline-flex; gap:5px; align-items:center; }
.pad-stat span::before{ content:""; width:8px; height:8px; border-radius:50%; }
.pad-stat .p1::before{ background:var(--primary); }
.pad-stat .p2::before{ background:var(--warn); }
.pad-stat .p3::before{ background:var(--line); }

/* ====== Scene · teach ====== */
.scn-teach{ position:absolute; inset:0; padding: 50px 40px 70px; }
.teach-page{
  height: 100%; background: var(--surface); border-radius:12px;
  border: 1px solid var(--line-soft); box-shadow: var(--shadow);
  padding: 28px 36px; display:flex; flex-direction:column; gap:14px;
  position:relative;
}
.teach-page h2{ margin:0; font-size:28px; font-weight:800; }
.teach-page .lead{ font-size:15px; color:var(--muted); font-weight:500; line-height:1.7; max-width:75%; }
.teach-page .lead strong{ color: var(--primary-dark); }
.teach-vis{ flex:1; display:grid; grid-template-columns: 1fr 1fr; gap:24px; align-items:center; }
.pizza{
  width:200px; height:200px; border-radius:50%;
  background: conic-gradient(var(--warn-soft) 0 25%, #fff 25% 50%, var(--warn-soft) 50% 75%, #fff 75%);
  border: 4px solid var(--warn);
  position:relative; margin: 0 auto;
  box-shadow: 0 8px 20px rgba(245,166,35,.2);
}
.pizza::before, .pizza::after{ content:""; position:absolute; background:var(--warn); }
.pizza::before{ top:0; left:50%; width:4px; height:100%; transform:translateX(-50%); }
.pizza::after{ left:0; top:50%; width:100%; height:4px; transform:translateY(-50%); }
.pizza-cap{ text-align:center; font-size:14px; color:var(--muted); font-weight:600; margin-top:10px; }
.bullet-list{ list-style:none; padding:0; margin:0; font-size:15px; line-height:2; }
.bullet-list li{ padding-left:24px; position:relative; }
.bullet-list li::before{ content:"●"; color:var(--primary); font-size:14px; position:absolute; left:6px; top:0; }
.bullet-list strong{ color:var(--primary-dark); }
.teacher-mark{
  position:absolute; left:54%; top:42%;
  width:200px; height:120px; border:3px dashed var(--danger);
  border-radius:50% / 30%;
  transform: rotate(-8deg);
  pointer-events:none;
  animation: markIn .8s ease;
}
.teacher-mark::after{
  content:"老师圈了这"; position:absolute; right:-110px; top:50%;
  background: var(--danger); color:#fff; padding:5px 10px; border-radius:14px;
  font-size:11.5px; font-weight:700;
  transform:translateY(-50%);
  box-shadow: var(--shadow);
  white-space:nowrap;
}
@keyframes markIn{ from{ opacity:0; transform: rotate(-8deg) scale(.6); } to{ opacity:1; transform: rotate(-8deg) scale(1); } }
.teach-pageinfo{
  position:absolute; right:18px; top:14px;
  font-size:12px; color:var(--muted); font-weight:600;
  background: var(--surface-2); padding:4px 10px; border-radius:12px;
  border:1px solid var(--line-soft);
}

/* ====== Scene · live（实时答题） ====== */
.scn-live{ position:absolute; inset:0; padding: 60px 40px 70px; display:flex; flex-direction:column; gap:10px; }
.live-q{ font-size:30px; font-weight:800; text-align:center; color:var(--text); margin: 0 0 4px; line-height:1.3; }
.live-q small{ display:block; font-size:13px; color:var(--muted); font-weight:500; margin-top:4px; }
.live-q strong{ color: var(--primary-dark); }
.live-opts{ display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin: 8px 0 8px; }
.live-opt{ background: var(--surface); border:2px solid var(--line); border-radius:12px; padding:14px 8px; text-align:center; }
.live-opt .k{
  width:34px; height:34px; border-radius:50%;
  background: var(--primary-soft); color:var(--primary-dark);
  display:grid; place-items:center;
  font-size:15px; font-weight:800; margin: 0 auto 6px;
}
.live-opt .v{ font-size:22px; font-weight:800; color:var(--text); }
.live-prog-row{
  display:flex; gap:18px; align-items:center;
  background: var(--surface); padding:12px 18px; border-radius:12px;
  border:1px solid var(--line-soft);
}
.live-prog-row .lpr-l{ flex:none; font-size:13px; font-weight:700; color:var(--muted); }
.live-prog-row .lpr-l strong{ color:var(--text); font-size:18px; }
.live-bar{ flex:1; height:14px; background: var(--line-soft); border-radius:99px; overflow:hidden; position:relative; }
.live-bar .fill{
  position:absolute; left:0; top:0; bottom:0;
  background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius:99px; transition: width 1s cubic-bezier(.25,.6,.3,1);
}
.live-prog-row .lpr-r{ flex:none; font-size:14px; font-weight:800; color:var(--primary-dark); min-width:40px; text-align:right; }
.live-fastest{
  background: var(--surface); border:1px solid var(--line-soft); border-radius:12px;
  padding:10px 16px; display:flex; gap:14px; align-items:center;
}
.live-fastest .lf-l{ font-size:13px; font-weight:700; color:var(--muted); flex:none; }
.live-fastest .lf-list{ display:flex; gap:14px; flex:1; align-items:center; overflow:hidden; }
.live-avatar{ display:flex; flex-direction:column; align-items:center; gap:3px; flex:none; }
.live-avatar .av{
  width:36px; height:36px; border-radius:50%;
  background: var(--accent-soft); color: var(--accent-dark);
  display:grid; place-items:center;
  font-size:14px; font-weight:800;
  border: 2px solid var(--accent);
}
.live-avatar.gold .av{ background:#fff4d2; color:#a06800; border-color:#f5b840; box-shadow: 0 0 0 3px rgba(245,184,64,.3); }
.live-avatar .nm{ font-size:11px; color:var(--text); font-weight:700; }
.live-avatar .rk{ font-size:9px; color:var(--accent-dark); font-weight:800; }

/* ====== Scene · result（揭晓） ====== */
.scn-result{ position:absolute; inset:0; padding: 56px 60px 80px; display:flex; flex-direction:column; }
.result-h{ display:flex; gap:10px; align-items:baseline; margin-bottom: 20px; flex-wrap:wrap; }
.result-h .lab{ font-size:14px; color:var(--muted); font-weight:600; }
.result-h .ans{
  font-size:28px; font-weight:800; color:var(--primary-dark);
  background: var(--primary-soft); padding:6px 16px; border-radius:10px;
  border:1px solid rgba(34,201,147,.25);
}
.result-h .stats{ margin-left:auto; font-size:14px; color:var(--muted); font-weight:600; }
.result-h .stats strong{ color:var(--primary-dark); font-size:20px; }
.result-privacy{
  flex-basis:100%;
  font-size:12px; color:var(--muted); font-weight:700;
  display:inline-flex; gap:6px; align-items:center;
}
.bars{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px; flex:1; align-items:end; margin-bottom:14px; padding-bottom:30px; }
.bar-col{ display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
.bar-wrap{ width:100%; height:100%; display:flex; flex-direction:column; justify-content:flex-end; position:relative; }
.bar{
  width:100%; background: var(--line-soft); border-radius: 8px 8px 0 0;
  transition: height 1.2s cubic-bezier(.25,.6,.3,1);
  display:flex; flex-direction:column; justify-content:flex-end;
  min-height:6px; position:relative;
}
.bar-col.correct .bar{ background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%); box-shadow: 0 -6px 18px rgba(34,201,147,.36); }
.bar .ct{
  font-size:14px; font-weight:800; color:var(--text);
  position:absolute; top:-22px; left:50%; transform:translateX(-50%);
}
.bar-col.correct .bar .ct{ color: var(--primary-dark); }
.bar-col .lab2{ margin-top:8px; font-size:13px; font-weight:600; color:var(--muted); display:flex; gap:6px; align-items:center; }
.bar-col .lab2 .key{
  display:inline-block; width:22px; height:22px; line-height:22px; border-radius:50%;
  background: var(--surface-2); color: var(--text); text-align:center;
  font-size:12px; font-weight:800;
}
.bar-col.correct .lab2 .key{ background: var(--primary); color:#fff; }

/* ====== Scene · draw（抽人） ====== */
.scn-draw{ position:absolute; inset:0; padding: 58px 56px 82px; display:grid; grid-template-columns: 1fr 1.15fr; gap:32px; align-items:center; }
.draw-pool{
  background: var(--surface); border:1px solid var(--line-soft); border-radius:14px;
  padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px;
}
.draw-pool-title{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); font-weight:800; }
.draw-pool-title strong{ color:var(--text); font-size:16px; }
.draw-list{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.draw-student{
  height:40px; border-radius:8px; border:1px solid var(--line-soft); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:var(--text-soft);
}
.draw-student.active{ background:var(--primary-soft); color:var(--primary-dark); border-color:rgba(34,201,147,.35); box-shadow:0 0 0 3px rgba(34,201,147,.12); }
.draw-student.dim{ color:var(--muted-2); }
.draw-status{ font-size:12px; color:var(--muted); font-weight:700; }
.draw-info{ flex:0 1 380px; }
.draw-info .di-h{ font-size:14px; color:var(--muted); font-weight:600; margin-bottom:6px; }
.draw-info .di-name{ font-size:64px; font-weight:800; color:var(--primary-dark); margin: 4px 0 16px; line-height:1; }
.draw-info .di-name.pop{ animation: popIn .5s cubic-bezier(.25,.6,.3,1.4); }
@keyframes popIn{
  0%{ transform: scale(.4); opacity:0; }
  60%{ transform: scale(1.18); opacity:1; }
  100%{ transform: scale(1); opacity:1; }
}
.draw-why{
  background: var(--accent-soft); padding: 14px 16px; border-radius:10px;
  border: 1px solid rgba(125,108,242,.18);
  font-size:14px; color:var(--text); line-height:1.7; font-weight:500;
}
.draw-why strong{ color: var(--accent-dark); }

/* ====== Scene · group（小组讨论） ====== */
.scn-group{ position:absolute; inset:0; padding: 50px 30px 80px; display:flex; flex-direction:column; }
.grp-row{ flex:1; display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin-top:12px; }
.grp-card{
  background: var(--surface); border:1px solid var(--line-soft); border-radius:14px;
  padding:14px; display:flex; flex-direction:column; gap:10px;
  box-shadow: var(--shadow);
}
.grp-h{ display:flex; gap:8px; align-items:center; }
.grp-h .gh-k{
  width:28px; height:28px; border-radius:50%;
  background: var(--primary); color:#fff; display:grid; place-items:center;
  font-size:12px; font-weight:800;
}
.grp-h .gh-t{ font-size:14px; font-weight:800; }
.grp-h .gh-t small{ display:block; margin-top:2px; color:var(--muted); font-size:11px; font-weight:700; }
.grp-h .gh-tag{ margin-left:auto; font-size:10px; padding:2px 8px; border-radius:6px; background:var(--primary-soft); color:var(--primary-dark); font-weight:700; }
.grp-photo{
  flex:1; min-height:112px;
  background:#f8fafc;
  border:1px solid var(--line-soft);
  border-radius:10px;
  overflow:hidden;
  display:block; font-size:0;
}
.grp-photo svg{ width:100%; height:100%; display:block; }
.scene-art .paper{ fill:#fff; stroke:#dbe4ef; stroke-width:1.5; }
.scene-art .label{ fill:#607086; font-size:11px; font-weight:800; }
.scene-art .thin{ stroke:#94a3b8; stroke-width:2; stroke-linecap:round; }
.scene-art .bold{ stroke:#0f172a; stroke-width:3; stroke-linecap:round; }
.grp-tags{ display:flex; flex-wrap:wrap; gap:5px; }
.grp-tags span{ font-size:11px; padding:3px 8px; border-radius:6px; background: var(--accent-soft); color:var(--accent-dark); font-weight:700; }

/* ====== Scene · end（下课总结） ====== */
.scn-end{ position:absolute; inset:0; padding: 50px 50px 80px; display:flex; flex-direction:column; gap:14px; background: linear-gradient(135deg, #f6efff 0%, #e6f9f3 100%); }
.end-h{ font-size:30px; font-weight:800; color:var(--text); }
.end-h small{ display:block; font-size:14px; color:var(--muted); font-weight:500; margin-top:4px; }
.end-key{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.ek-card{
  background: var(--surface); border-radius:12px; padding:18px;
  border:1px solid var(--line-soft); box-shadow: var(--shadow);
  position:relative;
}
.ek-num{
  width:36px; height:36px; border-radius:50%;
  background: var(--primary); color:#fff; font-size:18px; font-weight:800;
  display:grid; place-items:center; margin-bottom:8px;
}
.ek-card h4{ margin:0 0 4px; font-size:16px; font-weight:800; }
.ek-card p{ margin:0; font-size:13px; color:var(--muted); line-height:1.6; }
.ek-card p strong{ color: var(--primary-dark); }

.end-foot{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
.end-card{ background: var(--surface); border-radius:12px; padding:14px 16px; border:1px solid var(--line-soft); }
.end-card .ec-l{ font-size:13px; color:var(--muted); font-weight:600; margin-bottom:4px; }
.end-card .ec-t{ font-size:15px; font-weight:700; }
.end-card.warm{ background: linear-gradient(135deg, var(--warn-soft), #fff); border-color: rgba(245,166,35,.25); }

.scene-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
.scene-btn{
  border:0; background:var(--primary); color:#fff; border-radius:8px;
  padding:10px 18px; font-size:14px; font-weight:800; cursor:pointer;
  box-shadow:0 6px 16px rgba(34,201,147,.24);
}
.scene-btn.secondary{ background:var(--surface); color:var(--text); border:1px solid var(--line); box-shadow:none; }
.scene-btn.purple{ background:var(--accent); box-shadow:0 6px 16px rgba(125,108,242,.24); }
.scene-btn:active{ transform:translateY(1px); }
.metric-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.metric-card{
  background:var(--surface); border:1px solid var(--line-soft); border-radius:10px;
  padding:12px 14px;
}
.metric-card .m-num{ font-size:28px; line-height:1; font-weight:800; color:var(--primary-dark); }
.metric-card .m-lab{ margin-top:5px; font-size:12px; color:var(--muted); font-weight:700; }
.group-progress{ height:8px; background:var(--line-soft); border-radius:99px; overflow:hidden; }
.group-progress span{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--accent)); border-radius:99px; transition:width 1s cubic-bezier(.25,.6,.3,1); }

.toast.ok{ border-left:4px solid var(--primary); }
.toast.no{ border-left:4px solid var(--danger); }
.toast.warn{ border-left:4px solid var(--warn); }
.toast.info{ border-left:4px solid var(--accent); }

function toast(msg, type='ok', ms=2200){
  const stack = $('#toastStack'); if(!stack) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  const ic = type==='no'?'⛔':type==='warn'?'⚠️':type==='info'?'💡':'✓';
  el.innerHTML = `<span>${ic}</span><span>${msg}</span>`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; }, ms-300);
  setTimeout(()=> el.remove(), ms);
}

let welcomeCDInterval, liveCDInterval, liveAnsInterval;

function renderScene(scene){
  const fn = SCENES[scene];
  const screen = $('#sceneRoot');
  if(!fn){ screen.innerHTML = '<div style="padding:80px;text-align:center;color:#999">场景不存在</div>'; return; }
  // 清理 interval
  welcomeCDInterval && clearInterval(welcomeCDInterval);
  liveCDInterval && clearInterval(liveCDInterval);
  liveAnsInterval && clearInterval(liveAnsInterval);
  screen.innerHTML = fn();
  setupSceneEffects(scene);
  updateMiniBoard(scene);
}

function setupSceneEffects(scene){
  // ---- welcome：平板网格 + 距上课倒计时 ----
  if(scene==='welcome'){
    const grid = $('#padGrid');
    if(grid) grid.innerHTML = padGridHTML();
    let s = 4*60+58;
    welcomeCDInterval = setInterval(()=>{
      const el = $('#welcomeCD'); if(!el){ clearInterval(welcomeCDInterval); return; }
      s--;
      if(s<0){ el.textContent='上课啦'; clearInterval(welcomeCDInterval); return; }
      const m = String(Math.floor(s/60)).padStart(2,'0');
      const ss = String(s%60).padStart(2,'0');
      el.textContent = m+':'+ss;
    }, 1000);
  }
  // ---- live：进度条 / 最快头像 / 倒计时 / 已答数 ----
  if(scene==='live'){
    const lfl = $('#lfList');
    const names = [['嘉怡','1','gold'],['子涵','2',''],['晓彤','3',''],['家豪','4',''],['雨桐','5','']];
    if(lfl){
      lfl.innerHTML = names.map(([n,r,c])=>`
        <div class="live-avatar ${c}">
          <div class="av">${n[0]}</div>
          <div class="nm">${n}</div>
          <div class="rk">第 ${r} 名</div>
        </div>`).join('');
    }
    setTimeout(()=>{
      const fill = $('#liveFill'); if(fill) fill.style.width = '60.7%';
      const pct = $('#livePct'); if(pct) pct.textContent='61%';
    }, 200);
    let cd = 2*60+8;
    liveCDInterval = setInterval(()=>{
      const el = $('#liveCD'); if(!el){ clearInterval(liveCDInterval); return; }
      cd--;
      if(cd<0){ el.textContent='时间到'; clearInterval(liveCDInterval); return; }
      const m = String(Math.floor(cd/60)).padStart(2,'0');
      const ss = String(cd%60).padStart(2,'0');
      el.textContent = m+':'+ss;
    }, 1000);
    let ans = 17;
    liveAnsInterval = setInterval(()=>{
      const el = $('#liveAns'); if(!el){ clearInterval(liveAnsInterval); return; }
      if(ans>=27) return;
      if(Math.random()<0.35){
        ans++;
        el.textContent = ans;
        const p = Math.round(ans/28*100);
        const fill = $('#liveFill'); if(fill) fill.style.width = p+'%';
        const pct = $('#livePct'); if(pct) pct.textContent = p+'%';
      }
    }, 1500);
  }
  // ---- result：柱状图增长（只显示汇总，不展示个人） ----
  if(scene==='result'){
    setTimeout(()=>{
      $$('.bars .bar').forEach(b=>{ b.style.height = b.dataset.h + '%'; });
    }, 200);
  }
  // ---- draw：名单高亮后揭晓 ----
  if(scene==='draw'){
    setTimeout(()=>{
      const wait = $('#drawWaiting'); if(wait) wait.style.display='none';
      const nm = $('#drawName'); if(nm) nm.style.display='block';
      const why = $('#drawWhy'); if(why) why.style.display='block';
      const status = $('#drawStatus'); if(status) status.textContent = '已抽中 · 等待回答';
      toast('🎯 抽中：张嘉怡', 'info', 1800);
    }, 900);
  }
  // ---- group：小组进度条增长 ----
  if(scene==='group'){
    setTimeout(()=>{
      $$('.group-progress span').forEach(p=>{ p.style.width = p.dataset.w || '70%'; });
    }, 180);
  }
}

function updateMiniBoard(scene){
  const map = {
    welcome:'上课前 · 28 平板状态',
    teach:'课件第 3 页 · 老师讲解',
    live:'答题中 · 17/28',
    result:'答案揭晓 · 柱状图',
    draw:'抽人名单',
    group:'小组成果',
    end:'下课总结'
  };
  const lab = $('#miniBoardLabel'); if(lab) lab.textContent = map[scene] || '本端';
  // mini pads
  const pads = $('#miniPads');
  if(pads){
    let h = '';
    const cols = 7, rows = 4;
    for(let r=0; r<rows; r++){
      for(let c=0; c<cols; c++){
        const i = r*cols + c;
        if(i>=28) continue;
        const cls = i===27?'off':'on';
        h += `<div class="pad-mini ${cls}" style="left:${4+c*13}%;top:${10+r*22}%"></div>`;
      }
    }
    pads.innerHTML = h;
  }
}

// 切换 tab
// 全局事件
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]');
  if(!a) return;
  const act = a.dataset.act;
  if(act==='modalClose') closeModal();
  if(act==='prevPage'){
    renderLessonPage(lessonPageIndex - 1);
    return;
  }
  if(act==='nextPage'){
    renderLessonPage(lessonPageIndex + 1);
    return;
  }
  if(act==='pushLive'){
    toast('已向 28 台学生平板推送随堂题', 'ok', 1800);
    jumpScene('live');
  }
  if(act==='showTeacherTip'){
    showModal('课中提醒', '<p><strong>可追问：</strong>每份不一样大，还能叫 1/4 吗？</p>', '提醒');
  }
  if(act==='collectAnswers'){
    toast('已收题，准备展示全班分布', 'ok', 1500);
    jumpScene('result');
  }
  if(act==='showSlowList'){
    showModal('未答名单', '<p><strong>芷雨、明轩、星辰、嘉豪、乐乐、知远、晨晨、雨桐、佳宁、书航、子墨</strong>尚未提交。</p><p>可延长 30 秒后收题。</p>', '课堂状态', '延长 30 秒');
  }
  if(act==='explainWrong'){
    showModal('D 选项错因', '<p>9 名学生选了 <strong>D · 5/8</strong>。</p><p><strong>C · 4/9</strong> 离 1/2 更近。讲评时用数轴比较 4/9、1/2、5/8。</p>', '错因');
  }
  if(act==='sendRemedial'){
    toast('已给错答学生推送 1 道同类题', 'ok', 2200);
  }
  if(act==='rerollDraw'){
    const wait = $('#drawWaiting');
    const name = $('#drawName');
    const why = $('#drawWhy');
    const status = $('#drawStatus');
    $$('.draw-student').forEach(s=>s.classList.remove('active'));
    const students = $$('.draw-student');
    if(students[5]) students[5].classList.add('active');
    if(status) status.textContent = '正在抽取…';
    if(wait) wait.style.display='block';
    if(name){ name.style.display='none'; name.textContent='孙晨'; }
    if(why){ why.style.display='none'; why.innerHTML='请回答：5/8 为什么最接近 1/2？'; }
    setTimeout(()=>{
      if(wait) wait.style.display='none';
      if(name) name.style.display='block';
      if(why) why.style.display='block';
      if(status) status.textContent = '已抽中 · 等待回答';
      toast('🎯 抽中：孙晨', 'info', 1800);
    }, 900);
  }
  if(act==='switchDrawMode'){
    showModal('抽人模式已切换', '<p>当前模式：<strong>关注型</strong>。</p><p>系统会优先考虑“举手少、错题多、最近表达机会少”的学生，但仍然由老师决定是否点名。</p>', '课堂公平');
  }
  if(act==='groupDetail'){
    const g = a.dataset.group || 'A';
    const item = GROUP_DISCUSSION.find(x => x.id === g);
    const body = item
      ? `<p><strong>${item.title}</strong></p><p>${item.detail}</p><p><strong>追问：</strong>这里的整体是什么？每一份是不是一样大？</p>`
      : `<p>${g} 组已提交图片和关键词。</p><p><strong>追问：</strong>整体是什么？每一份一样大吗？</p>`;
    showModal(`第 ${g} 组成果`, body, '小组');
  }
  if(act==='publishHomework'){
    toast('已发布 3 层课后练习：基础 / 提升 / 挑战', 'ok', 2200);
  }
  if(act==='openReport'){
    showModal('课堂报告', '<div class="metric-row"><div class="metric-card"><div class="m-num">92%</div><div class="m-lab">圈选题正确率</div></div><div class="metric-card"><div class="m-num">9</div><div class="m-lab">通分错因人数</div></div><div class="metric-card"><div class="m-num">3</div><div class="m-lab">需课后跟进</div></div></div><p>报告已同步到教师端，课后批阅页会自动带出本节错因标签。</p>', '课后沉淀');
  }
});

document.addEventListener('keydown', e=>{
  if($('#modalBg')?.classList.contains('show')) return;
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){
    e.preventDefault();
    renderLessonPage(lessonPageIndex + 1);
  }
  if(e.key === 'ArrowLeft' || e.key === 'PageUp'){
    e.preventDefault();
    renderLessonPage(lessonPageIndex - 1);
  }
});

function renderLessonPage(index){
  const max = LESSON_FLOW.length - 1;
  lessonPageIndex = Math.max(0, Math.min(index, max));
  const page = LESSON_FLOW[lessonPageIndex];
  renderScene(page.scene);
  syncLessonControls();
}

function jumpScene(scene){
  const idx = LESSON_FLOW.findIndex(p => p.scene === scene);
  if(idx >= 0){
    renderLessonPage(idx);
    return;
  }
  renderScene(scene);
  syncLessonControls();
}
function syncLessonControls(){
  const page = LESSON_FLOW[lessonPageIndex] || {title:'课件页'};
  const prev = $('#prevPage');
  const next = $('#nextPage');
  const label = $('#lessonPageLabel');
  if(prev) prev.disabled = lessonPageIndex === 0;
  if(next) next.disabled = lessonPageIndex === LESSON_FLOW.length - 1;
  if(label) label.textContent = `第 ${lessonPageIndex + 1} / ${LESSON_FLOW.length} 页 · ${page.title}`;
}

// 初次渲染
setTimeout(()=>{
  renderLessonPage(0);
}, 50);
</script>
