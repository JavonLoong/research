<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1320">
<title>步步 · 白板端（教室大屏）原型</title>
<style>
/* ====== Design tokens（与教师端 / 学生端一致） ====== */
:root{
  --primary:#22c993; --primary-dark:#0ea874; --primary-soft:#e8f7f0;
  --accent:#7d6cf2; --accent-dark:#5b48d6; --accent-soft:#eee9ff;
  --warn:#f5a623; --warn-soft:#fff4e0;
  --danger:#e85a5a; --danger-soft:#fde7e7;
  --text:#1a2332; --muted:#6c7689; --muted-2:#9aa4b8;
  --line:#e3e6ec; --line-soft:#eef0f4;
  --surface:#ffffff; --surface-2:#f6f8fa;
  --bg:#eef1f6;
  --shadow:0 6px 20px rgba(20,30,55,.08);
  --shadow-lg:0 16px 50px rgba(20,30,55,.12);
  --radius:10px; --radius-lg:14px;
}
*{ box-sizing:border-box }
html, body{ margin:0; padding:0; }
body{
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* scene tabs */
.scene-tabs{
  max-width:1240px; margin:24px auto 18px; padding:0 20px;
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
}
.scene-tabs .tab{
  background:var(--surface); border:1px solid var(--line); border-radius:99px;
  padding:8px 16px; font-size:13px; font-weight:600;
  cursor:pointer; color:var(--text); transition: all .2s;
  user-select:none;
}
.scene-tabs .tab:hover{ border-color:var(--primary); color:var(--primary-dark); }
.scene-tabs .tab.active{
  background:var(--primary); color:#fff; border-color:var(--primary);
  box-shadow: 0 6px 16px rgba(34,201,147,.32);
}

/* ====== Whiteboard device shell（大屏外壳） ====== */
.board-shell{ max-width:1240px; margin: 0 auto 18px; padding: 0 20px; display:flex; justify-content:center; }
.board-frame{ width:1100px; max-width:100%; position:relative; }
.board-outer{
  background: #1a1f2c;
  padding: 22px 18px 22px;
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(20, 30, 55, .26), inset 0 0 0 1px rgba(255,255,255,.04);
}
.board-camera{
  position:absolute; top:6px; left:50%; transform:translateX(-50%);
  display:flex; gap:6px; align-items:center;
  font-size:10px; color:#8b94aa; font-weight:600; z-index:2;
  letter-spacing:.4px;
}
.board-camera::before{ content:""; width:6px; height:6px; border-radius:50%; background:#3a4256; box-shadow:0 0 0 2px #232938; }
.board-screen{
  width:100%; aspect-ratio: 16 / 9;
  background: linear-gradient(135deg, #f6f8fa 0%, #edf2f7 100%);
  border-radius: 8px;
  position:relative; overflow:hidden;
}
.scene-root{ position:absolute; inset:0; overflow:hidden; }
.board-canvas{
  position:absolute; inset:0; width:100%; height:100%; z-index:58;
  pointer-events:none; cursor:crosshair;
}
.board-canvas.active{ pointer-events:auto; }
.page-controls{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  z-index:66; display:flex; gap:12px; align-items:center;
  background:rgba(15,23,42,.78); color:#fff; border:1px solid rgba(255,255,255,.14);
  border-radius:14px; padding:8px 10px; box-shadow:0 12px 28px rgba(15,23,42,.20);
}
.page-controls button{
  min-width:72px; height:38px; border:0; border-radius:10px;
  background:#fff; color:#111827; font-weight:900; cursor:pointer;
}
.page-controls .primary{ background:var(--primary); color:#fff; }
.page-controls button:disabled{ opacity:.35; cursor:not-allowed; }
.page-label{ min-width:160px; text-align:center; font-size:13px; font-weight:900; color:#dbeafe; }
.floating-ball{
  position:absolute; right:22px; bottom:104px; z-index:80;
  width:64px; height:64px; border-radius:50%;
  touch-action:none; user-select:none;
}
.floating-ball.dragging{ transition:none; }
.float-main{
  width:64px; height:64px; border-radius:50%;
  border:1px solid rgba(255,255,255,.56);
  background:linear-gradient(135deg,#152033,#263f69);
  color:#fff; box-shadow:0 18px 44px rgba(15,23,42,.32);
  display:grid; place-items:center; cursor:pointer;
  font-weight:900; font-size:13px; letter-spacing:0;
}
.float-main span{ display:block; font-size:20px; line-height:1; margin-bottom:2px; }
.float-main small{ display:block; font-size:10px; color:#cbd5e1; font-weight:800; }
.floating-ball.open .float-main{ background:linear-gradient(135deg,var(--primary),#119f73); }
.floating-panel{
  position:absolute; z-index:79; width:312px; max-width:calc(100% - 36px);
  background:rgba(15,23,42,.94); color:#fff;
  border:1px solid rgba(255,255,255,.16); border-radius:14px;
  box-shadow:0 20px 48px rgba(15,23,42,.32);
  padding:12px; opacity:0; transform:translateY(10px) scale(.98);
  pointer-events:none; transition:opacity .16s ease, transform .16s ease;
}
.floating-panel.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.float-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.float-panel-title{ font-size:15px; font-weight:900; }
.float-panel-sub{ font-size:12px; color:#cbd5e1; margin-top:2px; }
.float-panel-close{
  width:30px; height:30px; border-radius:8px; border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.10); color:#fff; font-weight:900; cursor:pointer;
}
.pen-palette{ display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:8px; }
.pen-card{
  border:1px solid rgba(34,201,147,.34); border-radius:12px;
  background:rgba(34,201,147,.12); padding:10px;
}
.pen-card h4{ margin:0 0 8px; font-size:13px; }
.pen-row{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.pen-chip{
  height:30px; min-width:38px; border-radius:8px; border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.10); color:#fff; font-size:12px; font-weight:900; cursor:pointer;
}
.pen-chip.active{ outline:2px solid #fff; background:rgba(34,201,147,.36); }
.pen-color{ width:30px; min-width:30px; border-radius:50%; color:transparent; }
.pen-color[data-color="#111827"]{ background:#111827; }
.pen-color[data-color="#e11d48"]{ background:#e11d48; }
.pen-color[data-color="#2563eb"]{ background:#2563eb; }
.float-tool-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.float-tool{
  min-height:54px; border-radius:10px; border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.08); color:#fff; cursor:pointer;
  padding:9px; display:flex; align-items:center; gap:8px; justify-content:flex-start;
  text-align:left; font:inherit; transition:.16s ease;
}
.float-tool:hover,.float-tool.active{ background:rgba(34,201,147,.22); border-color:rgba(34,201,147,.78); transform:translateY(-1px); }
.float-tool .ico{ width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:rgba(255,255,255,.14); font-weight:900; flex:none; }
.float-tool strong{ font-size:13px; line-height:1.2; }
.float-tool span{ font-size:11px; line-height:1.35; color:#cbd5e1; display:none; }
.float-panel-foot{
  margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  color:#cbd5e1; font-size:12px; border-top:1px solid rgba(255,255,255,.10); padding-top:11px;
}
.float-panel-foot button{
  border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.10); color:#fff;
  border-radius:8px; padding:7px 10px; cursor:pointer; font-weight:800;
}
.board-stand{
  position:absolute; left:50%; bottom:-32px; transform:translateX(-50%);
  width:280px; height:14px;
  background: linear-gradient(180deg, #353b4c 0%, #1a1f2c 100%);
  border-radius: 0 0 8px 8px;
  box-shadow: 0 6px 16px rgba(0,0,0,.18);
}
.board-stand::after{
  content:""; position:absolute; left:50%; top:14px; transform:translateX(-50%);
  width:140px; height:8px;
  background: linear-gradient(180deg, #1a1f2c 0%, #0d1018 100%);
  border-radius: 0 0 12px 12px;
}
.board-base-text{
  position:absolute; left:50%; bottom:-50px; transform:translateX(-50%);
  font-size:10.5px; color:#8b94aa; font-weight:700; letter-spacing:1.2px;
}

/* ====== 大屏内部通用 UI ====== */
.bd-topbar{
  position:absolute; top:14px; left:18px; right:18px;
  display:flex; justify-content:space-between; align-items:center;
  z-index:5;
}
.bd-topbar .left, .bd-topbar .right{ display:flex; gap:8px; align-items:center; }
.chip{
  display:inline-flex; gap:6px; align-items:center;
  padding:5px 11px; border-radius:99px;
  background: var(--surface); border:1px solid var(--line-soft);
  font-size:12px; font-weight:700; color:var(--text);
  box-shadow: 0 1px 2px rgba(20,30,55,.04);
}
.chip strong{ color: var(--primary-dark); }
.chip.live{
  background: var(--danger-soft); color:var(--danger); border-color: rgba(232,90,90,.2);
}
.chip.live::before{
  content:""; width:7px; height:7px; border-radius:50%; background:var(--danger);
  animation: livePulse 1.4s infinite;
}
@keyframes livePulse{ 0%,100%{ opacity:.5; transform:scale(1) } 50%{ opacity:1; transform:scale(1.4) } }

/* ====== Scene · welcome ====== */
.scn-welcome{
  position:absolute; inset:0; padding: 58px 56px 92px;
  display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  background: linear-gradient(135deg, #f8fbff 0%, #e9f8f3 100%);
}
.w-eyebrow{ font-size:15px; color:var(--primary-dark); font-weight:800; letter-spacing:.4px; margin-bottom:10px; }
.w-title{ max-width:760px; font-size:46px; font-weight:900; color:var(--text); margin:6px 0 14px; line-height:1.15; }
.w-sub{ max-width:760px; font-size:22px; color:#334155; font-weight:700; line-height:1.55; margin-bottom:26px; }
.w-cd{
  display:inline-flex; gap:12px; align-items:baseline;
  background: var(--surface); padding:12px 22px; border-radius:14px;
  box-shadow: var(--shadow); border:1px solid var(--line-soft);
  margin-bottom:20px;
}
.w-cd .lab{ font-size:13px; color:var(--muted); font-weight:600; }
.w-cd .num{ font-size:30px; font-weight:800; color:var(--primary-dark); font-variant-numeric: tabular-nums; }
.pad-grid{ display:grid; grid-template-columns: repeat(14, 1fr); gap:5px; margin-top: 6px; max-width:520px; width:100%; }
.pad-grid .p{ aspect-ratio:1; background: var(--primary); border-radius:3px; box-shadow: 0 2px 4px rgba(34,201,147,.22); }
.pad-grid .p.charge{ background: var(--warn); }
.pad-grid .p.off{ background: var(--line); box-shadow:none; }
.pad-stat{ display:flex; gap:14px; margin-top:8px; font-size:12px; color:var(--muted); font-weight:600; }
.pad-stat span{ display:inline-flex; gap:5px; align-items:center; }
.pad-stat span::before{ content:""; width:8px; height:8px; border-radius:50%; }
.pad-stat .p1::before{ background:var(--primary); }
.pad-stat .p2::before{ background:var(--warn); }
.pad-stat .p3::before{ background:var(--line); }
.preclass-actions{
  position:absolute; right:48px; bottom:92px; z-index:8;
  display:flex; gap:10px; align-items:center;
}
.preclass-note-editor{
  margin-top:8px; display:flex; align-items:stretch; gap:10px;
  width:min(760px, 100%);
}
.preclass-note-editor textarea{
  flex:1; resize:none; border:1px solid var(--line);
  border-radius:10px; padding:10px 12px;
  font:600 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color:var(--text); background:rgba(255,255,255,.86);
  box-shadow:0 6px 18px rgba(20,30,55,.06);
}
.preclass-note-editor button{ flex:none; align-self:center; }

/* ====== Scene · teach ====== */
.scn-teach{ position:absolute; inset:0; padding: 64px 48px 88px; }
.teach-page{
  height: 100%; background: rgba(255,255,255,.66); border-radius:8px;
  border: 1px solid rgba(148,163,184,.20);
  padding: 30px 36px; display:flex; flex-direction:column; gap:14px;
  position:relative;
}
.teach-page::before{
  content:""; position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(148,163,184,.16) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148,163,184,.16) 1px, transparent 1px);
  background-size:36px 36px;
  pointer-events:none;
}
.teach-page > *{ position:relative; z-index:1; }
.teach-page h2{ margin:0; font-size:28px; font-weight:800; }
.teach-page .lead{ font-size:15px; color:var(--muted); font-weight:500; line-height:1.7; max-width:75%; }
.teach-page .lead strong{ color: var(--primary-dark); }
.teach-vis{ flex:1; display:grid; grid-template-columns: 1fr 1fr; gap:24px; align-items:center; }
.pizza{
  width:200px; height:200px; border-radius:50%;
  background: conic-gradient(var(--warn-soft) 0 25%, #fff 25% 50%, var(--warn-soft) 50% 75%, #fff 75%);
  border: 4px solid var(--warn);
  position:relative; margin: 0 auto;
  box-shadow: 0 8px 20px rgba(245,166,35,.2);
}
.pizza::before, .pizza::after{ content:""; position:absolute; background:var(--warn); }
.pizza::before{ top:0; left:50%; width:4px; height:100%; transform:translateX(-50%); }
.pizza::after{ left:0; top:50%; width:100%; height:4px; transform:translateY(-50%); }
.pizza-cap{ text-align:center; font-size:14px; color:var(--muted); font-weight:600; margin-top:10px; }
.bullet-list{ list-style:none; padding:0; margin:0; font-size:15px; line-height:2; }
.bullet-list li{ padding-left:24px; position:relative; }
.bullet-list li::before{ content:"●"; color:var(--primary); font-size:14px; position:absolute; left:6px; top:0; }
.bullet-list strong{ color:var(--primary-dark); }
.teacher-mark{
  position:absolute; left:54%; top:42%;
  width:200px; height:120px; border:3px dashed var(--danger);
  border-radius:50% / 30%;
  transform: rotate(-8deg);
  pointer-events:none;
  animation: markIn .8s ease;
}
.teacher-mark::after{
  content:"老师圈了这"; position:absolute; right:-110px; top:50%;
  background: var(--danger); color:#fff; padding:5px 10px; border-radius:14px;
  font-size:11.5px; font-weight:700;
  transform:translateY(-50%);
  box-shadow: var(--shadow);
  white-space:nowrap;
}
@keyframes markIn{ from{ opacity:0; transform: rotate(-8deg) scale(.6); } to{ opacity:1; transform: rotate(-8deg) scale(1); } }
.whiteboard-prompt{
  position:absolute; left:36px; top:30px; right:36px;
  display:flex; align-items:center; justify-content:space-between; gap:18px;
  color:#475569; font-size:15px; font-weight:800;
}
.whiteboard-prompt strong{ color:#0f172a; font-size:24px; }
.teach-pageinfo{
  position:absolute; right:18px; top:14px;
  font-size:12px; color:var(--muted); font-weight:600;
  background: var(--surface-2); padding:4px 10px; border-radius:12px;
  border:1px solid var(--line-soft);
}

/* ====== Scene · live（实时答题） ====== */
.scn-live{ position:absolute; inset:0; padding: 60px 40px 70px; display:flex; flex-direction:column; gap:10px; }
.live-q{ font-size:30px; font-weight:800; text-align:center; color:var(--text); margin: 0 0 4px; line-height:1.3; }
.live-q small{ display:block; font-size:13px; color:var(--muted); font-weight:500; margin-top:4px; }
.live-q strong{ color: var(--primary-dark); }
.live-opts{ display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin: 8px 0 8px; }
.live-opt{ background: var(--surface); border:2px solid var(--line); border-radius:12px; padding:14px 8px; text-align:center; }
.live-opt .k{
  width:34px; height:34px; border-radius:50%;
  background: var(--primary-soft); color:var(--primary-dark);
  display:grid; place-items:center;
  font-size:15px; font-weight:800; margin: 0 auto 6px;
}
.live-opt .v{ font-size:22px; font-weight:800; color:var(--text); }
.live-prog-row{
  display:flex; gap:18px; align-items:center;
  background: var(--surface); padding:12px 18px; border-radius:12px;
  border:1px solid var(--line-soft);
}
.live-prog-row .lpr-l{ flex:none; font-size:13px; font-weight:700; color:var(--muted); }
.live-prog-row .lpr-l strong{ color:var(--text); font-size:18px; }
.live-bar{ flex:1; height:14px; background: var(--line-soft); border-radius:99px; overflow:hidden; position:relative; }
.live-bar .fill{
  position:absolute; left:0; top:0; bottom:0;
  background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius:99px; transition: width 1s cubic-bezier(.25,.6,.3,1);
}
.live-prog-row .lpr-r{ flex:none; font-size:14px; font-weight:800; color:var(--primary-dark); min-width:40px; text-align:right; }
.live-fastest{
  background: var(--surface); border:1px solid var(--line-soft); border-radius:12px;
  padding:10px 16px; display:flex; gap:14px; align-items:center;
}
.live-fastest .lf-l{ font-size:13px; font-weight:700; color:var(--muted); flex:none; }
.live-fastest .lf-list{ display:flex; gap:14px; flex:1; align-items:center; overflow:hidden; }
.live-avatar{ display:flex; flex-direction:column; align-items:center; gap:3px; flex:none; }
.live-avatar .av{
  width:36px; height:36px; border-radius:50%;
  background: var(--accent-soft); color: var(--accent-dark);
  display:grid; place-items:center;
  font-size:14px; font-weight:800;
  border: 2px solid var(--accent);
}
.live-avatar.gold .av{ background:#fff4d2; color:#a06800; border-color:#f5b840; box-shadow: 0 0 0 3px rgba(245,184,64,.3); }
.live-avatar .nm{ font-size:11px; color:var(--text); font-weight:700; }
.live-avatar .rk{ font-size:9px; color:var(--accent-dark); font-weight:800; }

/* ====== Scene · result（揭晓） ====== */
.scn-result{ position:absolute; inset:0; padding: 56px 60px 80px; display:flex; flex-direction:column; }
.result-h{ display:flex; gap:10px; align-items:baseline; margin-bottom: 20px; flex-wrap:wrap; }
.result-h .lab{ font-size:14px; color:var(--muted); font-weight:600; }
.result-h .ans{
  font-size:28px; font-weight:800; color:var(--primary-dark);
  background: var(--primary-soft); padding:6px 16px; border-radius:10px;
  border:1px solid rgba(34,201,147,.25);
}
.result-h .stats{ margin-left:auto; font-size:14px; color:var(--muted); font-weight:600; }
.result-h .stats strong{ color:var(--primary-dark); font-size:20px; }
.bars{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px; flex:1; align-items:end; margin-bottom:14px; padding-bottom:30px; }
.bar-col{ display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
.bar-wrap{ width:100%; height:100%; display:flex; flex-direction:column; justify-content:flex-end; position:relative; }
.bar{
  width:100%; background: var(--line-soft); border-radius: 8px 8px 0 0;
  transition: height 1.2s cubic-bezier(.25,.6,.3,1);
  display:flex; flex-direction:column; justify-content:flex-end;
  min-height:6px; position:relative;
}
.bar-col.correct .bar{ background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%); box-shadow: 0 -6px 18px rgba(34,201,147,.36); }
.bar .ct{
  font-size:14px; font-weight:800; color:var(--text);
  position:absolute; top:-22px; left:50%; transform:translateX(-50%);
}
.bar-col.correct .bar .ct{ color: var(--primary-dark); }
.bar-col .lab2{ margin-top:8px; font-size:13px; font-weight:600; color:var(--muted); display:flex; gap:6px; align-items:center; }
.bar-col .lab2 .key{
  display:inline-block; width:22px; height:22px; line-height:22px; border-radius:50%;
  background: var(--surface-2); color: var(--text); text-align:center;
  font-size:12px; font-weight:800;
}
.bar-col.correct .lab2 .key{ background: var(--primary); color:#fff; }
.bar-avatars{ display:flex; flex-wrap:wrap; gap:2px; padding:4px; align-content:flex-end; }
.bar-avatars .a{
  width:14px; height:14px; border-radius:50%;
  background: rgba(255,255,255,.7);
  font-size:8px; font-weight:800; display:grid; place-items:center;
  color:var(--text);
}

/* ====== Scene · draw（抽人） ====== */
.scn-draw{ position:absolute; inset:0; padding: 50px 40px 80px; display:flex; align-items:center; justify-content:center; gap:50px; }
.draw-wheel{
  width:300px; height:300px; border-radius:50%;
  background: conic-gradient(from 0deg,
    var(--primary) 0 30deg, var(--accent) 30deg 60deg,
    var(--warn) 60deg 90deg, var(--danger) 90deg 120deg,
    var(--primary-dark) 120deg 150deg, var(--accent-dark) 150deg 180deg,
    var(--primary) 180deg 210deg, var(--accent) 210deg 240deg,
    var(--warn) 240deg 270deg, var(--danger) 270deg 300deg,
    var(--primary-dark) 300deg 330deg, var(--accent-dark) 330deg 360deg);
  position:relative;
  box-shadow: 0 12px 40px rgba(20,30,55,.18), inset 0 0 0 8px rgba(255,255,255,.32);
}
.draw-wheel.spin{ animation: wheelSpin 2.6s cubic-bezier(.16,.8,.34,1) forwards; }
@keyframes wheelSpin{ 0%{ transform: rotate(0deg) } 100%{ transform: rotate(1840deg) } }
.draw-pointer{

}
.grp-h .gh-t{ font-size:14px; font-weight:800; }
.grp-h .gh-tag{ margin-left:auto; font-size:10px; padding:2px 8px; border-radius:6px; background:var(--primary-soft); color:var(--primary-dark); font-weight:700; }
.grp-photo{

/* ====== Scene · end（下课总结） ====== */
.scn-end{ position:absolute; inset:0; padding: 50px 50px 80px; display:flex; flex-direction:column; gap:14px; background: linear-gradient(135deg, #f6efff 0%, #e6f9f3 100%); }

/* ====== Toast / Modal ====== */

.m-foot button{

<body>
<!-- ===== Whiteboard device shell ===== -->

<script>
// ============ 全局工具 ============
const $  = (s, p=document) => p.querySelector(s);
const $$ = (s, p=document) => Array.from(p.querySelectorAll(s));

function toast(msg, type='ok', ms=2200){
  const stack = $('#toastStack'); if(!stack) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  const ic = type==='no'?'⛔':type==='warn'?'⚠️':type==='info'?'💡':'✓';
  el.innerHTML = `<span>${ic}</span><span>${msg}</span>`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; }, ms-300);
  setTimeout(()=> el.remove(), ms);
}
function showModal(title, html, tag='演示', priText='我知道了'){
  $('#modalTitle').firstChild.nodeValue = title + ' ';
  $('#modalTag').textContent = tag;
  $('#modalBody').innerHTML = html;
  $('#modalPri').textContent = priText;
  $('#modalBg').classList.add('show');
}
function closeModal(){ $('#modalBg').classList.remove('show'); }
$('#modalBg').addEventListener('click', e=>{ if(e.target===$('#modalBg')) closeModal(); });

const CLASSMATES = ['李小明','陈思雨','张佳怡','王浩然','赵一诺','孙晨','刘安琪','周航','何雨桐','郑嘉豪','钱乐乐','许知远'];
function avatarHTML(names=CLASSMATES.slice(0,7)){
  return names.map((n,i)=>`
    <div class="live-avatar ${i===0?'gold':''}">
      <div class="av">${n.slice(0,1)}</div>
      <div class="nm">${n}</div>
      <div class="rk">#${i+1}</div>
    </div>`).join('');
}
function barAvatars(n){
  return Array.from({length:n}, (_,i)=>`<span class="a">${i+1}</span>`).join('');
}

// ============ 6 个场景的 HTML 渲染 ============
const SCENES = {
  welcome: () => `
    <div class="bd-topbar">
      <div class="left">
        <span class="chip">⏰ 16:55</span>
        <span class="chip" style="background:var(--primary-soft);color:var(--primary-dark)">17:00 开始上课</span>
      </div>
      <div class="right">
        <span class="chip">课前白板</span>
      </div>
    </div>
    <div class="scn-welcome">
      <div class="w-eyebrow">老师课前提示</div>
      <div class="w-title" id="preClassMessage">同学们，进教室后先安静入座，把要用的材料放在桌角。5 点准时开始。</div>
      <div class="w-sub">老师可以在课间把一段话直接发到这块白板上，全班进门第一眼就能看到。</div>
      <div class="w-cd">
        <span class="lab">距上课</span>
        <span class="num" id="welcomeCD">04:58</span>
      </div>
      <div class="preclass-note-editor">
        <textarea id="preClassNoteInput" rows="2">把水杯放到桌脚，黑板左侧留给今天的随手板书。</textarea>
        <button class="scene-btn pri" data-act="publishPreClassNote">发布到白板</button>
      </div>
    </div>
    <div class="preclass-actions"><button class="scene-btn pri" data-act="startClass">开始上课</button></div>
  `,
  teach: () => `
    <div class="bd-topbar">
      <div class="left">
        <span class="chip">白板讲解</span>
      </div>
      <div class="right">
        <span class="chip">白板笔可直接书写</span>
      </div>
    </div>
    <div class="scn-teach">

function selectScene(scene, silent=false){
  savePageInk();
  const idx = LESSON_FLOW.findIndex(item => item.scene === scene);
  if(idx >= 0) lessonPageIndex = idx;
  currentScene = scene;
  $$('#sceneTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.scene===scene));

  restorePageInk();

    const tab = $(`#sceneTabs .tab[data-scene="${scene}"]`);
    toast('已切换：' + (tab ? tab.textContent.trim() : scene), 'info', 1200);
  }
}

function renderLessonPage(index){
  const next = Math.max(0, Math.min(LESSON_FLOW.length - 1, index));
  lessonPageIndex = next;
  const scene = LESSON_FLOW[next].scene;
  selectScene(scene, true);
  return scene;
}

function resizeInkCanvas(preserve=true){
  const canvas = $('#boardCanvas');
  const screen = $('#boardScreen');
  if(!canvas || !screen) return;
  const existing = preserve ? canvas.toDataURL?.() : '';
  const rect = screen.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * ratio));
  canvas.height = Math.max(1, Math.round(rect.height * ratio));
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if(existing && existing.length > 100){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = existing;
  }
}

function getInkPoint(e){
  const canvas = $('#boardCanvas');
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches?.[0] || e.changedTouches?.[0];
  const clientX = touch ? touch.clientX : e.clientX;
  const clientY = touch ? touch.clientY : e.clientY;
  return {x: clientX - rect.left, y: clientY - rect.top};
}

function setPenActive(active=true){
  penActive = active;
  const canvas = $('#boardCanvas');
  canvas?.classList.toggle('active', penActive);
  $('[data-board-tool="pen"]')?.classList.toggle('active', penActive);
  toast(penActive ? '白板笔已开启：可以直接在屏幕上书写' : '白板笔已关闭', 'info', 1600);
}

function clearInk(){
  const canvas = $('#boardCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  annotationsByPage.delete(currentScene);
}
window.clearInk = clearInk;
function clearAnnotations(){ clearInk(); }
window.clearAnnotations = clearAnnotations;

function savePageInk(){
  const canvas = $('#boardCanvas');
  if(!canvas) return;
  annotationsByPage.set(currentScene, canvas.toDataURL());
}

function restorePageInk(){
  const canvas = $('#boardCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const data = annotationsByPage.get(currentScene);
  if(!data) return;
  const rect = canvas.getBoundingClientRect();
  const img = new Image();
  img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
  img.src = data;
}

function startInk(e){
  if(!penActive) return;
  if(e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  resizeInkCanvas();
  const canvas = $('#boardCanvas');
  const ctx = canvas.getContext('2d');
  inkDrawing = true;
  inkStart = getInkPoint(e);
  inkSnapshot = penMode === 'line' ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
  ctx.strokeStyle = penColor;
  ctx.lineWidth = penSize;
  ctx.beginPath();
  ctx.moveTo(inkStart.x, inkStart.y);
}

function moveInk(e){
  if(!inkDrawing || !penActive) return;
  e.preventDefault();
  const canvas = $('#boardCanvas');
  const ctx = canvas.getContext('2d');
  const point = getInkPoint(e);
  ctx.strokeStyle = penColor;
  ctx.lineWidth = penSize;
  if(penMode === 'line' && inkSnapshot){
    ctx.putImageData(inkSnapshot, 0, 0);
    ctx.beginPath();
    ctx.moveTo(inkStart.x, inkStart.y);
    ctx.lineTo(point.x, point.y);
    ctx.stroke();
  }else{
    ctx.lineTo(point.x, point.y);
    ctx.stroke();
  }
}

function endInk(e){
  if(!inkDrawing) return;
  moveInk(e);
  inkDrawing = false;
  inkSnapshot = null;
  savePageInk();
}

function initBoardInk(){
  resizeInkCanvas();
  const canvas = $('#boardCanvas');
  if(!canvas) return;
  window.annotationCanvas = canvas;
  canvas.addEventListener('pointerdown', startInk);
  canvas.addEventListener('pointermove', moveInk);
  canvas.addEventListener('pointerup', endInk);
  canvas.addEventListener('pointerleave', endInk);
  canvas.addEventListener('mousedown', startInk);
  canvas.addEventListener('mousemove', moveInk);
  document.addEventListener('mouseup', endInk);
  canvas.addEventListener('touchstart', startInk, {passive:false});
  canvas.addEventListener('touchmove', moveInk, {passive:false});
  canvas.addEventListener('touchend', endInk, {passive:false});
  window.addEventListener('resize', resizeInkCanvas);
}

  const interactive = '.floating-ball,.floating-panel,.page-controls,.board-tabs,.modal,.toast-stack,button,[data-act],[data-board-tool],[data-pen-color],[data-pen-size],[data-pen-mode]';
  const begin = e=>{

    const touch = e.touches?.[0];
    start = {x: touch ? touch.clientX : e.clientX, y: touch ? touch.clientY : e.clientY};
  };
  const finish = e=>{
    if(!start) return;
    const touch = e.changedTouches?.[0];
    const x = touch ? touch.clientX : e.clientX;
    const y = touch ? touch.clientY : e.clientY;
    handleBoardSwipe(x - start.x, y - start.y);
    start = null;
  };
  screen.addEventListener('mousedown', begin);
  screen.addEventListener('mouseup', finish);
  screen.addEventListener('touchstart', begin, {passive:true});
  screen.addEventListener('touchend', finish, {passive:true});
}

function showOverlay(id){
  const el = $('#' + id);
  if(el) el.classList.add('show');
}

function hideOverlay(id){
  const el = $('#' + id);

function hideBoardOverlays(){

function placeFloatingPanel(){
  const ball = $('#floatingBall');
  const panel = $('#floatingPanel');
  const screen = $('#boardScreen');
  if(!ball || !panel || !screen) return;
  const b = ball.getBoundingClientRect();
  const s = screen.getBoundingClientRect();
  const panelW = Math.min(312, s.width - 36);
  const panelH = Math.min(panel.offsetHeight || 320, s.height - 36);
  let x = (b.left - s.left) - panelW - 14;
  if(x < 18) x = (b.left - s.left) + b.width + 14;
  x = Math.max(18, Math.min(x, s.width - panelW - 18));
  let y = (b.top - s.top) - 112;
  y = Math.max(18, Math.min(y, s.height - panelH - 18));
  panel.style.left = `${x}px`;
  panel.style.top = `${y}px`;
}

function moveFloatingBall(x, y){
  const ball = $('#floatingBall');
  const screen = $('#boardScreen');
  if(!ball || !screen) return;
  const s = screen.getBoundingClientRect();
  const nextX = Math.max(12, Math.min(x, s.width - ball.offsetWidth - 12));
  const nextY = Math.max(12, Math.min(y, s.height - ball.offsetHeight - 12));
  ball.style.left = `${nextX}px`;
  ball.style.top = `${nextY}px`;
  ball.style.right = 'auto';
  ball.style.bottom = 'auto';
  placeFloatingPanel();
}
window.moveFloatingBall = moveFloatingBall;

function toggleFloatingPanel(force){
  const ball = $('#floatingBall');
  const panel = $('#floatingPanel');
  if(!ball || !panel) return;
  const shouldOpen = typeof force === 'boolean' ? force : !panel.classList.contains('show');
  panel.classList.toggle('show', shouldOpen);
  ball.classList.toggle('open', shouldOpen);
  if(shouldOpen) placeFloatingPanel();
}

function initFloatingBall(){
  const ball = $('#floatingBall');
  const main = $('#floatingMain');
  const screen = $('#boardScreen');
  if(!ball || !main || !screen) return;
  let dragging = false;
  let moved = false;
  let offsetX = 0;
  let offsetY = 0;

  main.addEventListener('click', e=>{
    e.stopPropagation();
    if(moved){ moved = false; return; }
    toggleFloatingPanel();
  });

  function startDrag(e){
    dragging = true;
    moved = false;
    ball.classList.add('dragging');
    const b = ball.getBoundingClientRect();
    offsetX = e.clientX - b.left;
    offsetY = e.clientY - b.top;
    if(e.pointerId !== undefined) ball.setPointerCapture?.(e.pointerId);
    e.preventDefault?.();
  }

  function dragMove(e){
    if(!dragging) return;
    moved = true;
    const s = screen.getBoundingClientRect();
    const x = Math.max(12, Math.min(e.clientX - s.left - offsetX, s.width - ball.offsetWidth - 12));
    const y = Math.max(12, Math.min(e.clientY - s.top - offsetY, s.height - ball.offsetHeight - 12));
    moveFloatingBall(x, y);
  }

  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    ball.classList.remove('dragging');
    if(e.pointerId !== undefined) ball.releasePointerCapture?.(e.pointerId);
  }

  ball.addEventListener('pointerdown', startDrag);
  ball.addEventListener('pointermove', dragMove);
  ball.addEventListener('pointerup', endDrag);
  ball.addEventListener('mousedown', startDrag);
  document.addEventListener('mousemove', dragMove);
  document.addEventListener('mouseup', endDrag);
}

// 抽人重抽（draw 场景共用）
function reSpinDraw(){
  const w = $('#drawWheel'); if(!w) return;
  const wait = $('#drawWaiting');
  const nm = $('#drawName');
  const why = $('#drawWhy');
  const acts = $('#drawActions');
  if(wait){ wait.style.display='block'; wait.textContent='转盘转动中…'; }
  if(nm){ nm.style.display='none'; nm.classList.remove('pop'); }
  if(why) why.style.display='none';
  if(acts) acts.style.display='none';
  w.classList.remove('spin');
  void w.offsetWidth;
  w.classList.add('spin');
  setTimeout(()=>{
    w.classList.remove('spin');
    if(wait) wait.style.display='none';
    if(nm){ nm.style.display='block'; nm.classList.add('pop'); }
    if(why) why.style.display='block';
    if(acts) acts.style.display='flex';
    toast('🎯 抽中：嘉怡', 'info', 1600);
  }, 2700);
}

document.addEventListener('click', e=>{
  const close = e.target.closest('[data-overlay-close]');
  if(close){
    hideOverlay(close.dataset.overlayClose);
    return;
  }
  const boardAction = e.target.closest('[data-board-action]');
  if(boardAction){
    if(boardAction.dataset.boardAction === 'closeFloatingPanel') toggleFloatingPanel(false);
    return;
  }
  const colorButton = e.target.closest('[data-pen-color]');
  if(colorButton){
    penColor = colorButton.dataset.penColor;
    window.penColor = penColor;
    updatePenChoice('[data-pen-color]', colorButton);
    setPenActive(true);
    return;
  }
  const sizeButton = e.target.closest('[data-pen-size]');
  if(sizeButton){
    penSize = Number(sizeButton.dataset.penSize) || 4;
    window.penSize = penSize;
    updatePenChoice('[data-pen-size]', sizeButton);
    setPenActive(true);
    return;
  }
  const modeButton = e.target.closest('[data-pen-mode]');
  if(modeButton){
    penMode = modeButton.dataset.penMode || 'curve';
    updatePenChoice('[data-pen-mode]', modeButton);
    setPenActive(true);
    return;
  }
  const tool = e.target.closest('[data-board-tool]');
  if(tool){
    const action = tool.dataset.boardTool;
    $$('.float-tool').forEach(b=> b.classList.toggle('active', b === tool && action === 'pen'));
    if(action === 'pen'){
      setPenActive(!penActive);
    }
    if(action === 'clearBoard'){
      clearInk();
      hideBoardOverlays();
      toast('已清空当前页批注', 'ok', 1600);
    }
    return;
  }
  if(!e.target.closest('#floatingBall') && !e.target.closest('#floatingPanel')){
    toggleFloatingPanel(false);
  }
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    closeModal();
    hideBoardOverlays();
    toggleFloatingPanel(false);
  }
});
